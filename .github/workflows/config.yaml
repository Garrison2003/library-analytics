name: Deploy to Terraform Enterprise

on:
  push:
    branches:
      - main
      - dev

env:
  TFC_TOKEN: ${{ secrets.tfc_team_token }}
  AWS_REGION: us-east-1

jobs:
  Deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Workspace Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "WORKSPACE_ID=ws-prod-1a2b3c4d" >> $GITHUB_ENV
            echo "TF_WORKSPACE=library-analytics-prod" >> $GITHUB_ENV
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "S3_BUCKET=library-analytics-frontend-prod" >> $GITHUB_ENV
            echo "DOMAIN_NAME=library-analytics.com" >> $GITHUB_ENV
            echo "AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_PROD }}" >> $GITHUB_ENV
            echo "AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID_PROD }}" >> $GITHUB_ENV
            echo "AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_PROD }}" >> $GITHUB_ENV
          else
            echo "WORKSPACE_ID=ws-YYMkyfZzJJ1bRt8d" >> $GITHUB_ENV
            echo "TF_WORKSPACE=library-analytics-dev" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "S3_BUCKET=library-analytics-frontend-dev" >> $GITHUB_ENV
            echo "DOMAIN_NAME=library-analytics-dev.com" >> $GITHUB_ENV
            echo "AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_DEV }}" >> $GITHUB_ENV
            echo "AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID_DEV }}" >> $GITHUB_ENV
            echo "AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_DEV }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js for Lambda
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Time Series Lambda
        run: |
          cd lambdas/timeSeriesLambda
          npm install
          npm run build
          cd ../..
          cd lambdas/timeSeriesLambda && zip -r ../../TF/lambda_function_payload.zip dist/ package.json node_modules/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.tfc_team_token }}

      - name: Terraform Init
        run: cd TF && terraform init

        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}

          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}


      - name: Terraform Validate
        run: cd TF && terraform validate
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}

          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}

      - name: Terraform Plan
        run: cd TF && terraform plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}

          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}


      - name: Terraform Apply
        run: cd TF && terraform apply -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}

          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}


      - name: Read Terraform Outputs
        run: |
          echo "TF_S3_BUCKET=$(cd TF && terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          echo "TF_DISTRIBUTION_ID=$(cd TF && terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React App
        run: |
          cd frontend
          npm install
          VITE_AUTH0_DOMAIN=${{ env.AUTH0_DOMAIN }} \
          VITE_AUTH0_CLIENT_ID=${{ env.AUTH0_CLIENT_ID }} \
          VITE_AUTH0_AUDIENCE=${{ env.AUTH0_AUDIENCE }} \
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.TF_S3_BUCKET }}/ --delete --cache-control "max-age=3600"
          aws s3 cp s3://${{ env.TF_S3_BUCKET }}/index.html s3://${{ env.TF_S3_BUCKET }}/index.html --content-type "text/html" --cache-control "no-cache, no-store, must-revalidate" --metadata-directive REPLACE

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.TF_DISTRIBUTION_ID }} --paths "/*"

